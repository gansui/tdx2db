name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只保留 x64(=amd64)：Linux 分别跑 Debian 12 / Debian 13 容器，
          # Windows 用 GitHub hosted（windows-latest, x64）。
          # golang:1.26-bookworm = Debian 12；golang:1.26-trixie = Debian 13。
          - os: ubuntu-latest
            container: golang:1.26-bookworm
            fname: debian12
            goos: linux
            goarch: amd64
            os_title: Linux
            arch_title: x86_64
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            container: golang:1.26-trixie
            fname: debian13
            goos: linux
            goarch: amd64
            os_title: Linux
            arch_title: x86_64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            fname: windows
            goos: windows
            goarch: amd64
            os_title: Windows
            arch_title: x86_64
            ext: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Linux 容器内置 golang:1.26-* 自带 Go 工具链，无需安装；
      # 仅 Windows 需要 setup-go。
      - name: Set up Go (windows only)
        if: matrix.goos == 'windows'
        uses: actions/setup-go@v5
        with:
          # 1.26+ 才支持 MSVC clang 作为 cgo 工具链（Windows 链接 MSVC 构建的
          # DuckDB 静态库必需）。
          go-version: "1.26"

      # Debian 的 unrar 位于 non-free/non-free-firmware 组件（golang 镜像只启用 main），
      # 先启用组件再安装。
      - name: Prepare datatool (linux only)
        if: matrix.goos == 'linux'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            grep -q "non-free" /etc/apt/sources.list.d/debian.sources || \
              sed -i 's/^Components: .*/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            grep -q "non-free" /etc/apt/sources.list || \
              sed -i 's/ main$/ main contrib non-free non-free-firmware/' /etc/apt/sources.list
          fi
          apt-get update
          apt-get install -y unrar
          make prepare

      # Windows 端 DuckDB 预编译静态库由 MSVC 构建，MinGW 无法链接。
      # DuckDB 官方 Go 支持链在 Windows 上即 MSVC —— 用 VS 自带的 clang（默认
      # -windows-msvc 目标，Go 1.26 会自动走 MSVC 链接参数 + lld-link）。
      # 说明：microsoft/setup-msvc 不存在，使用 ilammy/msvc-dev-cmd 激活 vcvars 环境。
      - name: Setup MSVC (windows only)
        if: matrix.goos == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # clang 剥离 wrapper：Go 在 Windows cgo 编译时无条件传 -mthreads（Go 官方
      # 修复 CL 800300 尚未发布），VS 新 clang(>=20) 对 -msvc 目标会硬报错。
      # 用一个过滤掉 -mthreads 的 clang.cmd 顶在 PATH 最前（FrankenPHP 同款做法）。
      - name: Prepare MSVC clang wrapper (windows only)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $cl = Join-Path $vs "VC\Tools\Llvm\x64\bin\clang.exe"
          if (-not (Test-Path $cl)) { throw "clang not found: $cl" }
          $dir = Join-Path $env:RUNNER_TEMP "clangwrap"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @"
          @echo off
          setlocal EnableDelayedExpansion
          set "ARGS="
          :loop
          if "%~1"=="" goto run
          if "%~1"=="-mthreads" ( shift & goto loop )
          set "ARGS=!ARGS! %~1"
          shift
          goto loop
          :run
          "$cl" %ARGS%
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Path (Join-Path $dir "clang.cmd") -Encoding ASCII
          Write-Output $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build (linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
            -o tdx2db${{ matrix.ext }} ./main.go

      - name: Build (windows, MSVC clang)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: clang
          GOOS: windows
          GOARCH: amd64
        run: |
          VERSION="$env:GITHUB_REF_NAME"
          DATE="$(Get-Date -Format o -AsUTC)"
          go build `
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=$env:GITHUB_SHA -X main.date=${DATE}" `
            -o tdx2db.exe ./main.go

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="tdx2db_${{ matrix.fname }}_${{ matrix.goos }}_x86_64"
          tar -czf "${NAME}.tar.gz" tdx2db${{ matrix.ext }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          NAME="tdx2db_${{ matrix.fname }}_${{ matrix.goos }}_x86_64"
          7z a "${NAME}.zip" tdx2db${{ matrix.ext }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.fname }}-${{ matrix.goarch }}
          path: tdx2db_*.*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: Determine pre-release
        id: prerel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            archives/tdx2db_*.* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ steps.prerel.outputs.flag }}